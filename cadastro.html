<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG Solidariedade</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>

        <h1>ONG Solidariedade</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Seja um colaborador</a>
        </nav>
    </header>

    <main>

        <section>

            <h2>Seja um colaborador</h2>

            <p>
                Preencha o formulário abaixo para participar das nossas ações e projetos solidários.
            </p>

        </section>

        <section>

            <form id="formCadastro">

                <fieldset>

                    <legend>Dados pessoais</legend>

                    <label for="Nome">Nome completo:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                        minlength="3"
                        maxlength="100"
                    >

                    <label for="cpf">CPF:</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                        pattern="\d{3}\.\d{3}\.\d{3}\-\d{2}"
                        title="Digite o CPF no formado 000.000.000-00"
                    >

                    <label for="nascimento">Data de nascimento:</label>
                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required
                    >

                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        required
                    >

                    <label for="telefone">Telefone:</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        required
                        pattern="\(\d{2}\) \d{5}-\d{4}"
                        title="Digite o telefone no formato (00) 00000-0000"
                    >
                </fieldset>

                <fieldset>

                    <legend>Endereço</legend>

                    <label for="cep">CEP:</label>
                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        maxlength="9"
                        required
                        pattern="\d{5}-\d{3}"
                        title="Digite o CEP no formato 00000-000"
                    >

                    <label for="endereco">Endereço:</label>
                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        required
                    >

                    <label for="cidade">Cidade:</label>
                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        required
                    >

                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>

                        <option value="">Selecione</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>

                    </select>

                </fieldset>

                <fieldset>

                    <legend>Participação</legend>

                    <label for="participacao">Como deseja colaborar?</label>

                    <select id="participacao" name="participacao" required>
                        
                        <option value="">Selecione</option>
                        <option value="voluntario">Trabalho voluntário</option>
                        <option value="doacao">Doações</option>
                        <option value="eventos">Participação em eventos</option>
                        <option value="outro">Outra forma</option>

                    </select>

                    <label for="mensagem">Mensagem:</label>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="5"
                        maxlength="500"
                        placeholder="Conte um pouco sobre como você gostaria de colaborar."
                    ></textarea>
                </fieldset>

                <button type="submit">Enviar cadastro</button>
            </form>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 ONG Solidariedade - Todos os direitos reservados.</p>

    </footer>

    <script src="js/script.js"></script>
    
</body>
</html>
